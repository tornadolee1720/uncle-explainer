name: Business Story C - original vpro (internal)
on:
  push:
    branches:
      - experiment/cashflow-story-c-20261124
    paths:
      - '.github/workflows/business-story-c.yml'
      - 'scripts/build_cash_story_c.mjs'
      - 'scripts/make_cash_story_art.mjs'
      - 'scripts/prepare_ci_fonts_fast.mjs'
      - 'scripts/business-c-v3/**'
      - 'scripts/business-c-v4/**'
      - 'tests/business-c/**'
      - 'kit/uncle.js'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  cash-story-c:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Check original storyline and financial arithmetic
        run: |
          node --check scripts/build_cash_story_c.mjs
          node --check scripts/make_cash_story_art.mjs
          node --test tests/business-c/business-c.test.mjs
      - name: Set up original vpro renderer and Traditional Chinese fonts
        run: |
          npm ci
          npx playwright install chromium
          node scripts/prepare_ci_fonts_fast.mjs
          npm install --no-save --no-package-lock @ffmpeg-installer/linux-x64 @ffprobe-installer/linux-x64
          test -x "node_modules/@ffmpeg-installer/linux-x64/ffmpeg"
          test -x "node_modules/@ffprobe-installer/linux-x64/ffprobe"
          echo "$PWD/node_modules/@ffmpeg-installer/linux-x64" >> "$GITHUB_PATH"
          echo "$PWD/node_modules/@ffprobe-installer/linux-x64" >> "$GITHUB_PATH"
          node_modules/@ffmpeg-installer/linux-x64/ffmpeg -hide_banner -encoders | grep libx264
      - name: Make new film and original business illustrations
        run: |
          node scripts/new_film.mjs "$RUNNER_TEMP/business-c" --vertical
          node scripts/make_cash_story_art.mjs "$RUNNER_TEMP/business-c"
          node scripts/build_cash_story_c.mjs tests/business-c/case.json "$RUNNER_TEMP/business-c"
          node scripts/timeline_stub.mjs "$RUNNER_TEMP/business-c/script.json"
      - name: Render actual 9:16 vpro MP4 (not replacement slides)
        run: |
          node scripts/render.mjs --dir "$RUNNER_TEMP/business-c" --check
          node scripts/render.mjs --dir "$RUNNER_TEMP/business-c" --sheet
          node scripts/render.mjs --dir "$RUNNER_TEMP/business-c" --video --h 720
      - name: Verify video and story scenario
        run: |
          python - <<'PY'
          import json,os,subprocess
          from pathlib import Path
          d=Path(os.environ['RUNNER_TEMP'])/'business-c'
          v=d/'out'/'visual_720.mp4'
          p=subprocess.run(['ffprobe','-v','error','-show_format','-show_streams','-of','json',str(v)],text=True,capture_output=True,check=True)
          data=json.loads(p.stdout)
          seconds=float(data['format']['duration'])
          streams=data.get('streams',[])
          vids=[s for s in streams if s['codec_type']=='video']
          auds=[s for s in streams if s['codec_type']=='audio']
          if not 45<=seconds<=85:raise SystemExit(f'Unexpected runtime: {seconds}')
          if len(vids)!=1 or vids[0]['codec_name']!='h264' or vids[0]['width']!=720 or vids[0]['height']!=1280 or vids[0]['r_frame_rate']!='30/1':
            raise SystemExit('Unexpected H264 format/resolution/frame rate')
          if len(auds):raise SystemExit('This preview is defined as silent and cannot claim Fish voice')
          q=json.loads((d/'STORY_DIRECTOR.json').read_text())
          if q['status']!='FICTIONAL_STORY_DIRECTOR_PASS' or q['model']['cash_shortfall']!=500000:
            raise SystemExit('Story/director financial gate failed')
          report={'status':'VPRO_C_VIDEO_PASS','fictional_scenario':True,
            'source':'Programmatic original SVG, no real company media',
            'duration_s':round(seconds,3),'fps':30,'resolution':'720x1280','codec':'H264',
            'scenes':q['scenes'],'distinct_types':len(q['scene_types']),
            'model':q['model'],'voice':'NONE_STUB_TIMELINE',
            'publish_allowed':False,'human_review_required':True}
          (d/'out'/'REPRO_QA.json').write_text(json.dumps(report,ensure_ascii=False,indent=2),encoding='utf8')
          print(json.dumps(report,ensure_ascii=False))
          PY
      - name: Regenerate actual V2 character and cash animations
        run: |
          python -m pip install --quiet Pillow numpy
          mkdir -p "$RUNNER_TEMP/business-c-v3"
          python scripts/business-c-v3/illustrate_v2.py "$RUNNER_TEMP/business-c-v3"
          python scripts/business-c-v3/recompose_v2.py \
            "$RUNNER_TEMP/business-c/out/visual_720.mp4" \
            "$RUNNER_TEMP/business-c-v3/intro_drama.mp4" \
            "$RUNNER_TEMP/business-c-v3/cash_motion.mp4" \
            "$RUNNER_TEMP/business-c-v3/Business_C_V2_story_motion_silent.mp4"
      - name: Stress test voice-led timing with synthetic QA tones - NOT Fish
        run: |
          python scripts/business-c-v3/voice_led.py \
            --video "$RUNNER_TEMP/business-c-v3/Business_C_V2_story_motion_silent.mp4" \
            --script "$RUNNER_TEMP/business-c/script.json" \
            --voice-dir "$RUNNER_TEMP/business-c-v3/tone_input" \
            --out "$RUNNER_TEMP/business-c-v3/voice_qa" \
            --test-tone
          python - <<'PY'
          import json,os
          from pathlib import Path
          p=Path(os.environ['RUNNER_TEMP'])/'business-c-v3'/'voice_qa'/'VOICE_QA.json'
          x=json.loads(p.read_text(encoding='utf8'))
          if x['status']!='TEST_TONE_AV_PASS':raise SystemExit('Test-tone A/V retime failed')
          if x['voice_identity']!='SYNTHETIC_TONE_NOT_FISH':raise SystemExit('Source-labeled voice flag missing')
          if x['per_word_alignment_verified']:raise SystemExit('This is not true word alignment')
          if x['av_delta_s']>.20:raise SystemExit('A/V length drift over 200ms')
          print('VOICE_LED_BEAT_TIMING_QA_PASS',x['duration'],x['av_delta_s'])
          PY
      - name: Validate physical-audio-driven NATIVE vpro timing, not FFmpeg retime
        run: |
          cp "$RUNNER_TEMP/business-c/out/sheet.png" "$RUNNER_TEMP/business-c/out/sheet_original_stub.png"
          python scripts/business-c-v4/native_voice_timeline.py --film-dir "$RUNNER_TEMP/business-c" --test-tones
          node scripts/render.mjs --dir "$RUNNER_TEMP/business-c" --check
          node scripts/render.mjs --dir "$RUNNER_TEMP/business-c" --sheet
          python - <<'PY'
          import os,json
          from pathlib import Path
          d=Path(os.environ['RUNNER_TEMP'])/'business-c'
          qa=json.loads((d/'NATIVE_VOICE_QA.json').read_text())
          t=json.loads((d/'timeline.json').read_text())
          if qa['status']!='NATIVE_VPRO_PHYSICAL_AUDIO_TIMELINE_PASS':raise SystemExit('Native audio timing failed')
          if qa['voice']!='SYNTHETIC_TEST_TONES_NOT_FISH':raise SystemExit('Test audio mislabeled')
          if qa['per_word_alignment_verified']:raise SystemExit('Estimated character anchors cannot be marked word-aligned')
          if t.get('stub') or len(t['beats'])!=10:raise SystemExit('Native physical voice timeline not generated')
          if any(not (b['start'] < b['end']) for b in t['beats']):raise SystemExit('Invalid native beat bounds')
          print('V4_NATIVE_VPRO_TIMELINE_PASS',t['duration'])
          PY
      - name: Internal-only artifact - no social publishing
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: business-story-c-internal-${{ github.run_number }}
          retention-days: 7
          if-no-files-found: warn
          path: |
            ${{ runner.temp }}/business-c/out/visual_720.mp4
            ${{ runner.temp }}/business-c-v3/Business_C_V2_story_motion_silent.mp4
            ${{ runner.temp }}/business-c-v3/V2_REPRO_QA.json
            ${{ runner.temp }}/business-c-v3/voice_qa/VOICE_QA.json
            ${{ runner.temp }}/business-c-v3/voice_qa/sentence_captions.srt
            ${{ runner.temp }}/business-c/out/sheet.png
            ${{ runner.temp }}/business-c/out/sheet_original_stub.png
            ${{ runner.temp }}/business-c/timeline.json
            ${{ runner.temp }}/business-c/NATIVE_VOICE_QA.json
            ${{ runner.temp }}/business-c/out/REPRO_QA.json
            ${{ runner.temp }}/business-c/STORY_DIRECTOR.json
            ${{ runner.temp }}/business-c/script.json
            ${{ runner.temp }}/business-c/film.js
            ${{ runner.temp }}/business-c/ASSET_CREDITS.md
            tests/business-c/case.json
