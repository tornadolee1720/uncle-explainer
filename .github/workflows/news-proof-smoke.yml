name: News evidence + native vpro smoke (internal only)

on:
  pull_request:
    paths:
      - '.github/workflows/news-proof-smoke.yml'
      - 'scripts/verify_news_capture.mjs'
      - 'scripts/build_news_proof.mjs'
      - 'scripts/build_news_story.mjs'
      - 'scripts/mux_news_av.py'
      - 'scripts/build_news_fish_smoke.mjs'
      - 'scripts/import_fish_master.py'
      - 'tests/news-proof/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  proof:
    name: Capture actual news and render original vpro
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install original runtime
        run: |
          npm ci
          npx playwright install --with-deps chromium
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-noto-cjk
          python -m pip install --quiet fonttools
          python scripts/prepare_ci_fonts.py
      - name: Fixture test (NOT genuine news)
        run: |
          mkdir -p "$RUNNER_TEMP/fixture"
          cat > "$RUNNER_TEMP/fixture/demo.html" <<'EOF'
          <!doctype html><html><head><title>NVIDIA offline fixture ONLY</title></head>
          <body><h1>NVIDIA local test fixture, not a news site</h1>
          <p>Revenue of $115.8 billion</p><p>Data Center revenue of $107.6 billion</p></body></html>
          EOF
          node - "$RUNNER_TEMP/fixture" <<'NODE'
          const fs=require('node:fs'), path=require('node:path'), {pathToFileURL}=require('node:url');
          const d=process.argv[2]; const jobs=[{id:'local_fixture',url:pathToFileURL(path.join(d,'demo.html')).href,find:['Revenue of $115.8 billion'],off:140}];
          fs.writeFileSync(path.join(d,'jobs.json'),JSON.stringify(jobs));
          NODE
          node scripts/snap_news.mjs "$RUNNER_TEMP/fixture/jobs.json"
          node scripts/verify_news_capture.mjs "$RUNNER_TEMP/fixture/jobs.json" --fixture
      - name: Render 4s from repository native vpro (fixture only)
        run: |
          node scripts/new_film.mjs "$RUNNER_TEMP/native_smoke" --vertical
          cp tests/news-proof/smoke_script.json "$RUNNER_TEMP/native_smoke/script.json"
          cp tests/news-proof/smoke_film.js "$RUNNER_TEMP/native_smoke/film.js"
          node scripts/timeline_stub.mjs "$RUNNER_TEMP/native_smoke/script.json"
          node scripts/render.mjs --dir "$RUNNER_TEMP/native_smoke" --check
          node scripts/render.mjs --dir "$RUNNER_TEMP/native_smoke" --stills 1,3
          node scripts/render.mjs --dir "$RUNNER_TEMP/native_smoke" --video --h 720 --range 0:4
      - name: Capture actual NVIDIA official webpages
        id: real_capture
        continue-on-error: true
        run: node scripts/snap_news.mjs tests/news-proof/nvidia_jobs.json
      - name: Fail closed unless a real official screenshot has visible keywords
        id: verify
        run: node scripts/verify_news_capture.mjs tests/news-proof/nvidia_jobs.json
      - name: Native vpro with REAL screenshot + highlight
        if: steps.verify.outcome == 'success'
        run: |
          node scripts/new_film.mjs "$RUNNER_TEMP/real_film" --vertical
          node scripts/build_news_proof.mjs tests/news-proof/nvidia_jobs.json "$RUNNER_TEMP/real_film"
          node scripts/timeline_stub.mjs "$RUNNER_TEMP/real_film/script.json"
          node scripts/render.mjs --dir "$RUNNER_TEMP/real_film" --check
          node scripts/render.mjs --dir "$RUNNER_TEMP/real_film" --sheet
          node scripts/render.mjs --dir "$RUNNER_TEMP/real_film" --video --h 720 --range 0:4
      - name: Genuine Fish Audio voice + ASR alignment + native vpro video
        if: steps.verify.outcome == 'success'
        env:
          AUDIO_BLOB_SHA: 1c6c6e80b609c5ff210da600a377bdd129bc9ad0
          GH_TOKEN: ${{ github.token }}
          PYTHONUNBUFFERED: '1'
        run: |
          node scripts/build_news_fish_smoke.mjs tests/news-proof/nvidia_jobs.json "$RUNNER_TEMP/real_film"
          python - <<'PY'
          import os,json,base64,urllib.request
          from pathlib import Path
          sha=os.environ['AUDIO_BLOB_SHA']
          url=f'https://api.github.com/repos/tornadolee1720/uncle-explainer/git/blobs/{sha}'
          req=urllib.request.Request(url,headers={
              'Accept':'application/vnd.github+json',
              'Authorization':'Bearer '+os.environ['GH_TOKEN'],
              'X-GitHub-Api-Version':'2022-11-28'})
          with urllib.request.urlopen(req, timeout=50) as resp:
              data=json.load(resp)
          if data.get('encoding')!='base64' or data.get('sha')!=sha:
              raise SystemExit('Fish audio blob integrity metadata mismatch')
          raw=base64.b64decode(data['content'])
          if len(raw)<20000 or not raw.startswith(bytes.fromhex('fffb')) and not raw.startswith(b'ID3') and not raw.startswith(bytes.fromhex('fff3')):
              # MP3 files might have a variable MPEG header; rely on ffprobe after this as final truth.
              if len(raw)<20000:raise SystemExit('Fish MP3 too short')
          p=Path(os.environ['RUNNER_TEMP'])/'real_film'/'fish_master.mp3'
          p.write_bytes(raw)
          print('FISH AUDIO FROM ORIGINAL MP3 BLOB',p.name,len(raw),'bytes')
          PY
          python -m pip install --quiet faster-whisper opencc-python-reimplemented
          python scripts/import_fish_master.py "$RUNNER_TEMP/real_film" "$RUNNER_TEMP/real_film/fish_master.mp3" --blob-sha "$AUDIO_BLOB_SHA" --whisper-model base
          node scripts/render.mjs --dir "$RUNNER_TEMP/real_film" --check
          node scripts/render.mjs --dir "$RUNNER_TEMP/real_film" --sheet
          node scripts/render.mjs --dir "$RUNNER_TEMP/real_film" --video --h 720
          python scripts/mix.py "$RUNNER_TEMP/real_film"
          python scripts/mux_news_av.py "$RUNNER_TEMP/real_film" fish_project_voice
      - name: Voice pipeline reporting
        if: always()
        run: |
          if test -f "$RUNNER_TEMP/real_film/out/AV_QA.json"; then cat "$RUNNER_TEMP/real_film/out/AV_QA.json"; fi
      - name: Upload evidence and generated previews; NEVER publish
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: news-proof-internal-${{ github.run_number }}
          if-no-files-found: warn
          retention-days: 7
          path: |
            tests/news-proof/docs/
            ${{ runner.temp }}/fixture/docs/
            ${{ runner.temp }}/native_smoke/out/
            ${{ runner.temp }}/real_film/out/
            ${{ runner.temp }}/real_film/EVIDENCE_MANIFEST.json
            ${{ runner.temp }}/real_film/timeline.json
            ${{ runner.temp }}/real_film/film.js
            ${{ runner.temp }}/real_film/script.json
            ${{ runner.temp }}/real_film/FISH_VOICE_PROVENANCE.json
