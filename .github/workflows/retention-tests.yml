name: Retention tests
on:
  pull_request:
  push:
    branches: [main]
jobs:
  retention:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test tests/retention*.test.mjs
      - run: node --check scripts/new_film.mjs && node --check scripts/render.mjs
